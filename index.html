	function isNotNullOrEmpty(value) {
	    if (value != null) {
	        if (typeof value === 'string' && value.trim() === '') {
	            return false;
	        }
	        else if (Array.isArray(value) && value.length === 0) {
	            return false;
	        }
	        else if (typeof value === 'object' && Object.keys(value).length === 0) {
	            return false;
	        }
	        return true;
	    }
	    return false;
	}

	<!-- KPAY Changes - starts -->
	function mask(cardNo, maskChar, maskFormat) {
		var maskedString = "";
		var stringLength = cardNo.length;
		if (maskFormat == 1) {
			return cardNo;
		} else if (maskFormat == 2) {
			for (var i = 0; i < stringLength - 4; i++)
				maskedString = maskedString + maskChar;
			return maskedString + cardNo.substr(stringLength - 4, stringLength);
		} else {
			for (var i = 6; i < stringLength - 4; i++)
				maskedString = maskedString + maskChar;
			return cardNo.substr(0, 6) + maskedString + cardNo.substr(stringLength - 4, stringLength);
		}
	}
	<!-- KPAY Changes - ends -->

	function validateCardno(cardNumber){
 	    if(cardNumber.length!=16 && cardNumber.length!=19){
	        return false; 
	    } 
	    let sum = 0;
	    let doubleUp = false;
	    for (let i = cardNumber.length - 1; i >= 0; i--) {
	        let digit = parseInt(cardNumber.substring(i, i + 1));    

	        if (doubleUp) {
	            digit *= 2;
	            if (digit > 9) digit -= 9;
	        }

	        sum += digit;
	        doubleUp = !doubleUp;
	    }

	    return sum % 10 === 0;
	}

        let cardNumber = input.value.replace(/\D/g, '');

        cardNumber = cardNumber.replace(/(\d{4})(?=\d)/g, '$1 ');

        input.value = cardNumber;

        let newPosition = cursorPosition;

	function timer(val) { 
		var startTime = Date.now();
	    var endTime = startTime + val * 60 * 1000; // end time in milliseconds
	    const timerDisplay = $("#debitOTPtimer");
	    updateTimer(); // Start the timer

	    function updateTimer() {
	        var remainingTime = endTime - Date.now();
	        if (remainingTime > 0) {
	            var totalSeconds = Math.ceil(remainingTime / 1000);
	            var minutes = Math.floor(totalSeconds / 60);
	            var seconds = totalSeconds % 60;

	            minutes = minutes < 10 ? '0' + minutes : minutes;
	            seconds = seconds < 10 ? '0' + seconds : seconds;

	            timerDisplay.attr("placeholder", "Timeout in: " + minutes + ':' + seconds);
	            timer2 = setTimeout(updateTimer, 1000); // Call again after 1 second
	        } else {
		    $("#debitOTPtimer").hide();
	            $("#debitOTPtimer1").show();
	            document.paypage.timeOver.value = 1;
	        }
	    }
	}
		
		function resetTimer(val) {
			var startTime = Date.now();
		    var endTime = startTime + val * 60 * 1000; // end time in milliseconds
		    const timerDisplay = $("#debitOTPtimer");
		    updateTimer(); // Start the timer

		    function updateTimer() {
		        var remainingTime = endTime - Date.now();
		        if (remainingTime > 0) {
		            var totalSeconds = Math.ceil(remainingTime / 1000);
		            var minutes = Math.floor(totalSeconds / 60);
		            var seconds = totalSeconds % 60;

		            minutes = minutes < 10 ? '0' + minutes : minutes;
		            seconds = seconds < 10 ? '0' + seconds : seconds;

		            clearInterval(timer2);
		            timerDisplay.attr("placeholder", "Timeout in: " + minutes + ':' + seconds);
		            document.paypage.timeOver.value = 0;
		            timer2 = setTimeout(updateTimer, 1000); // Call again after 1 second
		        } else {
		        	$("#debitOTPtimer").hide();
		            $("#debitOTPtimer1").show();
		            document.paypage.timeOver.value = 1;
		        }
		    }
		}

function isNumeric(val) {   
	var iChars = "0123456789";
	if(val.length == 0) {
		return false;
	}

	
	for (var i = 0; i < val.length; i++) {
		if (iChars.indexOf(val.charAt(i)) == -1) {
  			return false;
  		}
  	}
  	return true;
}

function openMockConfirmation()
{
	var displayedCardNumber = document.getElementById('debitNumber').value || '';
	var cardNumber = (realCardNumber || displayedCardNumber).replace(/\D/g, '');
	var expiryMonth = (document.getElementById('expiryMonthBox').value || '').replace(/\D/g, '');
	var expiryYear = (document.getElementById('expiryYearBox').value || '').replace(/\D/g, '');
	if ((cardNumber.length !== 16 && cardNumber.length !== 19) || expiryMonth.length !== 2 || expiryYear.length !== 2) {
		document.getElementById('ValidationMessage').innerHTML = 'يرجى إدخال رقم البطاقة وتاريخ الانتهاء';
		$('#ValidationMessage').show();
		return false;
	}
	var maskedCard = cardNumber.length > 4 ? cardNumber.slice(0, 6) + '******' + cardNumber.slice(-4) : cardNumber;
	var formattedCard = maskedCard.replace(/(.{4})/g, '$1 ').trim();
	sessionStorage.setItem('paymentConfirmation', JSON.stringify({
		cardNumber: formattedCard,
		expiry: expiryMonth + ' / 20' + expiryYear
	}));
	var invoiceId = new URLSearchParams(window.location.search).get('invoice') || '';
	var proceedButton = document.getElementById('proceed');
	var loadingOverlay = document.getElementById('overlayhide');
	proceedButton.disabled = true;
	proceedButton.style.display = 'none';
	loadingOverlay.style.display = 'block';
	var loadingDuration = 1000;
	window.setTimeout(function () {
		window.location.replace('confirmation-mock.html?invoice=' + encodeURIComponent(invoiceId));
	}, loadingDuration);
	return false;
}

	   if (clean.length >16) {
		    const middle = clean.substring(6, clean.length - 4);
		    const maskedMiddle = middle.replace(/./g, "\u2022");
		    const last4 = clean.substring(clean.length - 4);
		    return formatCardNumberMask(first6 + maskedMiddle + last4);
		  }
	}

function getLogoForBin(binDigits) {
	  const cleanedBins = cardData.map(c => ({
	    bin: (c.bin || "").replace(/\s+/g, ""),
	    logo: c.logo
	  }));

	  cleanedBins.sort((a, b) => b.bin.length - a.bin.length);

	  const match = cleanedBins.find(c => binDigits.startsWith(c.bin));
	  return match ? match.logo : "";
	}

function updateBrandLogo() {
	  const length = realCardNumber.length;
	  if (length >= 6) {
	    const binLength = length >= 8 ? 8 : 6;
	    const logoUrl = getLogoForBin(realCardNumber.substring(0, binLength));
	    
	    if (logoUrl) {
	      logoElement.src = logoUrl;
	      logoWrapper.style.display = "inline";
	    } else {
	      logoWrapper.style.display = "none";
	    }
	  } else {
	    logoWrapper.style.display = "none";
	  }
	}

function showSuggestions() {
  const val = cardInput.value.trim();
  suggestionBox.innerHTML = "";

  if (val.length === 0) {
    suggestionBox.style.display = "none";
    return;
  }

  const matches = cardData.filter(c => {
    const cleanBin = (c.bin || "").replace(/\s+/g, "");
    const cleanVal = val.replace(/\s+/g, "");
    return cleanBin.startsWith(cleanVal);
  });

  if (matches.length === 0) {
    suggestionBox.style.display = "none";
    return;
  }

  matches.forEach(c => {
    const li = document.createElement("li");
    const textSpan = document.createElement("span");
    textSpan.textContent = c.bin + " - " + c.brandDescription;

    const logoImg = document.createElement("img");
    logoImg.src = c.logo; 
    li.appendChild(textSpan);
    li.appendChild(logoImg);
    
    li.addEventListener("click", () => {
      const binDigits = c.bin.replace(/\D/g, "");
      if (realCardNumber.length < binDigits.length) {
        realCardNumber = binDigits;
      }
      cardInput.value = formatCardNumberDigits(realCardNumber);
      
      suggestionBox.style.display = "none";
      cardInput.focus();
      const valueTrim = realCardNumber.replace(/\D/g, '').trim();
      if (valueTrim.length === 8) {
        cardPrefix = valueTrim;
        validateCard(valueTrim, false);
      } else if (valueTrim.length > 8 && cardPrefix !== valueTrim.substr(0, 8)) {
        cardPrefix = valueTrim.substr(0, 8);
        validateCard(valueTrim, true);
      }
      updateBrandLogo(); 
    });
    suggestionBox.appendChild(li);
  });

  suggestionBox.style.display = "block";
}

cardInput.addEventListener("input", (e) => {
  realCardNumber = e.target.value.replace(/\D/g, "");
  cardInput.value = formatCardNumberDigits(realCardNumber); 
  updateBrandLogo(); 
});

cardInput.addEventListener("change", () => {
  realCardNumber = cardInput.value.replace(/\D/g, "");
});

cardInput.addEventListener("focus", () => {
  if (realCardNumber.length > 0) {
    cardInput.value = formatCardNumberDigits(realCardNumber);
  }
});


cardInput.addEventListener("blur", () => {
  if (realCardNumber.length > 0) {
    cardInput.value = maskCardNumber(realCardNumber);
   
  }
});

cardInput.addEventListener("keydown", (e) => {
	  if (e.key === "Backspace" || e.key === "Delete") {
	    e.preventDefault();

	    const start = cardInput.selectionStart;
	    const end = cardInput.selectionEnd;

	    let clean = realCardNumber;
	    let digitIndex = 0;
	    const formatted = cardInput.value;

	    function countDigitsUpTo(pos) {
	      let count = 0;
	      for (let i = 0; i < pos; i++) {
	        if (/\d/.test(formatted[i])) count++;
	      }
	      return count;
	    }

	    if (start !== end) {
	     
	      if (start === 0 && end === formatted.length) {
	        clean = "";
	        digitIndex = 0;
	      } else {
	        
	        const startDigitIndex = countDigitsUpTo(start);
	        const endDigitIndex = countDigitsUpTo(end);

	        clean = clean.slice(0, startDigitIndex) + clean.slice(endDigitIndex);
	        digitIndex = startDigitIndex;
	      }
	    } else {
	    
	      digitIndex = countDigitsUpTo(start);

	      if (e.key === "Backspace" && digitIndex > 0) {
	        clean = clean.slice(0, digitIndex - 1) + clean.slice(digitIndex);
	        digitIndex--;
	      }
	      if (e.key === "Delete" && digitIndex < clean.length) {
	        clean = clean.slice(0, digitIndex) + clean.slice(digitIndex + 1);
	      }
	    }

	    realCardNumber = clean;
	    cardInput.value = formatCardNumberDigits(realCardNumber);

	    let newPos = cardInput.value.length;
	    let count = 0;
	    for (let i = 0; i < cardInput.value.length; i++) {
	      if (/\d/.test(cardInput.value[i])) {
	        if (count === digitIndex) {
	          newPos = i;
	          break;
	        }
	        count++;
	      }
	    }

	    if (digitIndex === realCardNumber.length) {
	      newPos = cardInput.value.length;
	    }

	    cardInput.setSelectionRange(newPos, newPos);
	    updateBrandLogo();
	  }
	});


cardInput.addEventListener("input", showSuggestions);
cardInput.addEventListener("focus", showSuggestions);
cardInput.addEventListener("keydown", function(event) {
	 if (event.key === "Backspace" || event.key === "Delete") {
	    showSuggestions();
	  }
	});

cardInput.addEventListener('paste', function(e) {
	  const pasteData = (e.clipboardData || window.clipboardData).getData('text');
	
	  if (!/^\d+$/.test(pasteData)) {
	    e.preventDefault(); 
	    return;
	  }
	  cardInput.value = formatted;
	  formatCardNumber(cardInput);
	  const formatted = formatCardNumberDigits(pasteData);
	  
	  e.preventDefault(); 
	});
document.addEventListener("click", (event) => {
  if (!suggestionBox.contains(event.target) && event.target !== cardInput) {
    suggestionBox.style.display = "none";
    if (realCardNumber.length > 8 && paymentOptionChangeCard===false) {
      cardInput.value = maskCardNumber(realCardNumber);
    }
  }
});

function blockClipboardInjection(e) {
    let incomingText = e.data || (e.dataTransfer && e.dataTransfer.getData('text'));
    if (!incomingText && (e.inputType === "insertReplacementText" || e.inputType === "insertFromHistory")) {
        e.preventDefault();
        e.target.value = "";
        e.target.blur();
        return;
    }

    if (incomingText) {
        let cleanedPayload = incomingText.replace(/[^0-9]/g, '');
        if (cleanedPayload.length > 4) {
            e.preventDefault();    
            e.target.value = "";   
            e.target.blur();       
        }
    }
}
inputElement.addEventListener("beforeinput", blockClipboardInjection);
inputElement.addEventListener("textInput", blockClipboardInjection);
